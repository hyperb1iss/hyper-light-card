name: CI/CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Run ID of the release workflow (for release notes artifact)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: hyper-light-card-js
          path: target/hyper-light-card.js
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    uses: hyperb1iss/shared-workflows/.github/workflows/github-release.yml@v1
    with:
      attach-artifacts: true
      artifact-pattern: 'hyper-light-card-*'
      release-notes-run-id: ${{ inputs.release_run_id }}
    permissions:
      contents: write
      actions: read
    secrets: inherit
