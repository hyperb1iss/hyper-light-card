name: CI/CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${TAG}" = "v${version}"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Verify built card
        run: bun run test:build
      - name: Upload release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyper-light-card-js
          path: |
            target/hyper-light-card.js
            target/hyper-light-card.js.map
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hyper-light-card-js
          path: artifacts/
      - name: Publish verified card
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s artifacts/hyper-light-card.js
          test -s artifacts/hyper-light-card.js.map
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" artifacts/hyper-light-card.js artifacts/hyper-light-card.js.map --clobber
          else
            gh release create "${TAG}" artifacts/hyper-light-card.js artifacts/hyper-light-card.js.map \
              --verify-tag --title "Hyper Light Card ${TAG}" --generate-notes
          fi
